<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SampleTube</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>SampleTube</h1>
            <p class="subtitle">Beat-aligned video sampling</p>
        </header>

        <main>
            <!-- File Input Section -->
            <section id="file-section">
                <div id="drop-zone">
                    <p>Drop a video file here or</p>
                    <input type="file" id="file-input" accept="video/*">
                    <label for="file-input" class="file-label">Choose File</label>
                </div>
            </section>

            <!-- Video Player Section -->
            <section id="player-section" class="hidden">
                <video id="video-player" controls></video>

                <!-- Waveform Visualization -->
                <div id="waveform-container">
                    <canvas id="waveform-canvas"></canvas>
                </div>

                <!-- Analysis Status -->
                <div id="analysis-status">
                    <div id="detector-selector">
                        <label for="detector-type">Detector:</label>
                        <select id="detector-type">
                            <option value="essentia">Essentia.js</option>
                            <option value="json">Load JSON</option>
                        </select>
                        <input type="file" id="json-file-input" accept=".json" class="hidden">
                        <label for="json-file-input" id="json-file-label" class="hidden">Choose JSON</label>
                    </div>
                    <span id="status-text">Ready</span>
                    <progress id="analysis-progress" value="0" max="100" class="hidden"></progress>
                </div>

                <!-- Hotkey Display -->
                <div id="hotkey-panel">
                    <div class="hotkey-header">
                        <h3>Hotkeys</h3>
                        <div class="hotkey-controls">
                            <button id="btn-default" title="Spread keys across beats">Default</button>
                            <button id="btn-clear" title="Clear all assignments">Clear</button>
                            <select id="quantize-mode">
                                <option value="beat">Snap to Beat</option>
                                <option value="downbeat">Snap to Downbeat</option>
                                <option value="off">No Snap</option>
                            </select>
                            <div class="speed-controls">
                                <button id="btn-speed-down" title="Decrease speed">-</button>
                                <span id="speed-display">1.00x</span>
                                <button id="btn-speed-up" title="Increase speed">+</button>
                            </div>
                        </div>
                    </div>
                    <div id="hotkey-list">
                        <!-- Generated by JS -->
                    </div>
                </div>

                <!-- Instructions -->
                <div id="instructions">
                    <p><strong>Usage:</strong></p>
                    <ul>
                        <li><kbd>1</kbd>-<kbd>9</kbd>, <kbd>0</kbd> — Jump to assigned time (or assign if empty)</li>
                        <li><kbd>Shift</kbd>+<kbd>1</kbd>-<kbd>0</kbd> — Re-assign key to current time</li>
                        <li><kbd>Space</kbd> — Play/Pause</li>
                        <li><kbd>[</kbd> / <kbd>]</kbd> — Decrease/Increase speed</li>
                    </ul>
                </div>
            </section>
        </main>
    </div>

    <!-- Essentia.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia-wasm.web.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia.js-core.js"></script>

    <!-- App modules -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
